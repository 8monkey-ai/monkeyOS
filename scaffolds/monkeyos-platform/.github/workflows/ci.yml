name: monkeyOS reusable CI
on:
  workflow_call:
permissions:
  contents: read
  packages: write
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNTIME_ARCH: ${{ vars.RUNTIME_ARCH || 'arm64' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Validate local database, RLS, audit, and seed
        if: ${{ hashFiles('supabase/config.toml') != '' }}
        run: bun run db:test
      - name: Install browser
        if: ${{ hashFiles('playwright.config.ts') != '' }}
        run: bunx playwright install --with-deps chromium
      - name: Responsive browser tests
        if: ${{ hashFiles('playwright.config.ts') != '' }}
        run: bun run test:e2e
      - run: bun run build
      - name: Contract and version audit
        run: bun run audit:repository --deterministic
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Validate runtime architecture
        id: runtime
        run: |
          case "$RUNTIME_ARCH" in arm64|amd64) ;; *) exit 1 ;; esac
          echo "arch=$RUNTIME_ARCH" >> "$GITHUB_OUTPUT"
      - name: Resolve canonical image reference
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build immutable selected-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          pull: true
          platforms: linux/${{ steps.runtime.outputs.arch }}
          tags: ${{ steps.image.outputs.ref }}
      - name: Container smoke test
        run: bun run test:container "${{ steps.image.outputs.ref }}"
      - name: Authenticate to GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish tested selected-architecture image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: docker push "${{ steps.image.outputs.ref }}"
