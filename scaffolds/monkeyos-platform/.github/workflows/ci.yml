name: monkeyOS reusable CI
on:
  workflow_call:
permissions:
  contents: read
  packages: write
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNTIME_ARCH: ${{ vars.RUNTIME_ARCH || 'arm64' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Validate local database, RLS, audit, and seed
        if: ${{ hashFiles('supabase/config.toml') != '' }}
        run: bun run db:test
      - name: Install browser
        if: ${{ hashFiles('playwright.config.ts') != '' }}
        run: bunx playwright install --with-deps chromium
      - name: Responsive browser tests
        if: ${{ hashFiles('playwright.config.ts') != '' }}
        run: bun run test:e2e
      - run: bun run build
      - name: Contract and version audit
        run: bun run audit:repository --deterministic
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Validate runtime architecture
        id: runtime
        run: |
          case "$RUNTIME_ARCH" in arm64|amd64) ;; *) exit 1 ;; esac
          echo "arch=$RUNTIME_ARCH" >> "$GITHUB_OUTPUT"
      - name: Resolve canonical image reference
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build immutable selected-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          pull: true
          platforms: linux/${{ steps.runtime.outputs.arch }}
          tags: ${{ steps.image.outputs.ref }}
      - name: Start immutable image for smoke testing
        env:
          APP_IMAGE: ${{ steps.image.outputs.ref }}
          GIT_SHA: ${{ github.sha }}
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
        run: >-
          docker run --detach --rm --name monkeyos-container-smoke
          --publish 127.0.0.1:3000:3000
          --env APP_ENV=production
          --env GIT_SHA
          --env SUPABASE_URL
          --env SUPABASE_PUBLISHABLE_KEY
          "$APP_IMAGE"
      - name: Wait for immutable image
        run: >-
          curl --fail --silent --show-error
          --retry 30 --retry-all-errors --retry-delay 1
          http://127.0.0.1:3000/healthz
      - name: Smoke test immutable image
        env:
          EXPECTED_GIT_SHA: ${{ github.sha }}
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_PRODUCTION_IMAGE: "true"
        run: bun run test:e2e --project=desktop
      - name: Show immutable image logs after failure
        if: failure()
        run: docker logs monkeyos-container-smoke || true
      - name: Stop immutable image
        if: always()
        run: docker stop monkeyos-container-smoke || true
      - name: Authenticate to GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish tested selected-architecture image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: docker push "${{ steps.image.outputs.ref }}"
